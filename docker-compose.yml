services:
 # 1. Vector Database
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "qdrant --version || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 3
  # 2. Knowledge Graph Database
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j_db
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1;' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  qdrant_data:
  neo4j_data:
  redis_data: