name: RAG Pipeline Continuous Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ragas datasets

      - name: Create Placeholder .env File
        run: |
          touch .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}" >> .env

      - name: Spin Up Service Containers
        run: |
          docker compose up -d qdrant neo4j redis
          docker compose ps

      - name: Wait for Neo4j Database Readiness
        run: |
          echo "Waiting for Neo4j to accept connections on port 7687..."
          timeout 60s bash -c 'until nc -z localhost 7687; do sleep 2; done'
          sleep 5

      - name: Seed Sample Data & Run Ingestion Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          mkdir -p data
          echo "Sameer Balkawade works as a Software Development Engineer at Amazon starting September 2025." > data/experience.txt
          echo "Technical stack includes JavaScript, Java, Python, C++, React, Angular, Node.js, ASP.NET Core, MongoDB, PostgreSQL, Qdrant, Neo4j, Redis, AWS, and Docker." > data/tech_stack.txt
          python -m app.ingest

      - name: Run Ragas Evaluation Quality Gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/test_ragas_eval.py -s